name: Create Docker Image (Manual Build on ARM Runner to Docker Hub)

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target Platforms'
        required: true
        default: 'linux/arm/v7' # 在 ARM64 机器上原生编译 32 位 ARMv7 镜像

env:
  # 请将下面的 your-dockerhub-username 替换为你实际的 Docker Hub 用户名或组织名
  # 镜像最终会发布为：your-dockerhub-username/sillytavern
  IMAGE_NAME: junlinwu/sillytavern

jobs:
  build:
    # 注意：如果使用的是 GitHub 官方或自建的 ARM 架构 runner，请在此处指定对应的 labels
    # 例如：runs-on: [self-hosted, linux, ARM64] 或 runs-on: ubuntu-24.04-arm
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633 # v4.1.2

      # 获取当前日期格式为 YYYY-MM-DD
      - name: Get current date
        run: |
          echo "BUILD_DATE=$(date +'%Y-%m-%d')" >> ${GITHUB_ENV}

      # 初始化 Docker Buildx（原生 ARM 环境下依然推荐使用 Buildx）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # 生成 Tag：一个日期 Tag（如 2026-08-30）和一个 latest Tag
      - name: Extract metadata (tags, labels) for the image
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        id: metadata
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.BUILD_DATE }}
            type=raw,value=latest

      # 登录到 Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 构建并推送至 Docker Hub
      - name: Build and push
        uses: docker/build-push-action@2cdde995de11925a030ce8070c3d77a52ffcf1c0 # v5.3.0
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          file: Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}